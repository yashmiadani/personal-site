<!doctype html><meta charset="utf-8"><title>Worker publish check</title><input id="p" type="password" aria-label="Editor password"><button id="go" type="button">Publish identical file</button><pre id="out">Ready</pre><script>go.onclick=async()=>{out.textContent='Checking';try{const content=await (await fetch('resume-data.js?test='+Date.now())).text();let r=await fetch('https://yashmi-editor-api.innovative-newt.workers.dev',{method:'POST',headers:{'Content-Type':'application/json','X-Editor-Password':p.value},body:JSON.stringify({path:'resume-data.js',content,message:'Editor API end-to-end test (no content change)'})});out.textContent=r.status+' '+await r.text()}catch(e){out.textContent='ERROR '+e.message}}</script>
