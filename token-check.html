<!doctype html><meta charset="utf-8"><title>Token check</title><input id="t" type="password" aria-label="Cloudflare token"><button id="go">Verify</button><pre id="out">Ready</pre><script>go.onclick=async()=>{out.textContent='Checking';try{let r=await fetch('https://api.cloudflare.com/client/v4/user/tokens/verify',{headers:{Authorization:'Bearer '+t.value}}),j=await r.json();out.textContent=r.status+' '+(j.success?'VALID':'INVALID')+' '+(j.result?.status||j.errors?.[0]?.message||'')}catch(e){out.textContent='ERROR '+e.message}}</script>
